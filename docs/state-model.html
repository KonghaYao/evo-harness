<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evo Agent System 的数学表达验证</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" />
  <style>
    :root {
      --bg: #f1eee7;
      --ink: #1b1916;
      --muted: #6a655c;
      --faint: #8a8478;
      --rule: #d8d2c6;
      --panel: #fffcf7;
      --accent: #2f4a43;
      --accent-soft: rgba(47, 74, 67, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141311;
        --ink: #ece7de;
        --muted: #a39b8e;
        --faint: #7a7468;
        --rule: #3a372f;
        --panel: #1c1b18;
        --accent: #b7cfc6;
        --accent-soft: rgba(183, 207, 198, 0.1);
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }
    body {
      font-family: "Iowan Old Style", Palatino, "Palatino Linotype", "Songti SC", "Source Han Serif SC", serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }
    .page {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(250px, 0.8fr);
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      max-width: 1180px;
      margin: 0 auto;
    }
    .proof {
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      padding: 22px 24px 16px 32px;
      border-right: 1px solid var(--rule);
    }
    .kicker {
      margin: 0 0 4px;
      font-size: 0.66rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--faint);
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.05rem, 2.2vh, 1.55rem);
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .depth {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0;
      margin: 0 0 10px;
      border-bottom: 1px solid var(--rule);
      flex: 0 0 auto;
    }
    .tab {
      margin: 0;
      padding: 8px 4px 10px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--faint);
      font: inherit;
      font-size: 0.72rem;
      padding: 8px 2px 10px;
      letter-spacing: 0.02em;
      cursor: pointer;
    }
    .tab.is-on {
      color: var(--ink);
      border-bottom-color: var(--accent);
    }
    .tab:focus-visible { outline: none; color: var(--ink); }
    .sheet {
      display: none;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
    }
    .sheet.is-on { display: flex; }
    .parts {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 6px;
      margin: 0 0 8px;
      flex: 0 0 auto;
    }
    .part {
      margin: 0;
      padding: 6px 2px 5px;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: var(--panel);
      color: inherit;
      font: inherit;
      cursor: pointer;
      text-align: center;
    }
    .part strong {
      display: block;
      font-style: italic;
      font-size: clamp(0.95rem, 2vh, 1.12rem);
      font-weight: 600;
    }
    .part span {
      display: block;
      margin-top: 1px;
      font-size: 0.58rem;
      letter-spacing: 0.03em;
      color: var(--faint);
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
    }
    .part:hover,
    .part:focus-visible,
    .part.is-on {
      outline: none;
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .rail {
      position: relative;
      margin: 0;
      padding: 0;
      list-style: none;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
    }
    .rail > li {
      min-height: 0;
      flex: 1 1 0;
      display: flex;
    }
    .rail::before {
      content: "";
      position: absolute;
      left: 13px;
      top: 10px;
      bottom: 10px;
      width: 1px;
      background: var(--rule);
    }
    .line {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: 100%;
      margin: 0;
      padding: 2px 10px 2px 34px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }
    .line:hover,
    .line:focus-visible,
    .line.is-on {
      background: var(--accent-soft);
      outline: none;
    }
    .line.is-on::before,
    .line:hover::before { background: var(--accent); }
    .line::before {
      content: "";
      position: absolute;
      left: 9px;
      top: 50%;
      width: 9px;
      height: 9px;
      margin-top: -4.5px;
      border-radius: 50%;
      background: var(--rule);
      z-index: 1;
    }
    .idx {
      display: block;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 1px;
    }
    .eq, .fb {
      margin: 0;
      font-size: clamp(0.86rem, 1.9vh, 1.08rem);
      overflow: hidden;
    }
    .eq .katex-display { margin: 0.08em 0; }
    .eq { display: none; }
    .eq.visible { display: block; }
    .fb {
      display: none;
      font-style: italic;
      letter-spacing: 0.01em;
    }
    .fb.visible { display: block; }
    .fb sub { font-size: 0.62em; }
    .hint {
      margin: 6px 0 0;
      font-size: 0.72rem;
      color: var(--faint);
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      letter-spacing: 0.04em;
      flex: 0 0 auto;
    }
    .stage {
      min-height: 0;
      height: 100%;
      overflow: hidden;
      padding: 22px 28px;
      display: flex;
      align-items: center;
    }
    .float {
      width: 100%;
      max-height: 100%;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--rule);
      border-radius: 14px;
      padding: 20px 22px 22px;
      transform: translateY(14px);
      opacity: 0;
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
    }
    .float.up { transform: translateY(0); opacity: 1; }
    .float .tag {
      margin: 0 0 10px;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 0.66rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .float h2 {
      margin: 0 0 8px;
      font-size: clamp(0.98rem, 2.1vh, 1.16rem);
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .float .mini {
      margin: 0 0 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--rule);
      font-size: clamp(0.88rem, 1.9vh, 1.02rem);
      overflow: hidden;
    }
    .float .mini .katex-display { margin: 0.08em 0; }
    .float p {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: clamp(0.8rem, 1.65vh, 0.93rem);
    }
    .float p:last-child { margin-bottom: 0; }
    .float em { color: var(--ink); font-style: italic; }
  </style>
</head>
<body>
  <div class="page">
    <section class="proof">
      <p class="kicker">Verification</p>
      <h1>Evo Agent System 的数学表达验证</h1>
      <div class="depth" role="tablist" aria-label="四层深度">
        <button class="tab is-on" type="button" data-sheet="base" role="tab">Base · H</button>
        <button class="tab" type="button" data-sheet="gamma" role="tab">第一层 · Γ</button>
        <button class="tab" type="button" data-sheet="judge" role="tab">评判 · J</button>
        <button class="tab" type="button" data-sheet="git" role="tab">第二层 · git</button>
      </div>

      <div class="sheet is-on" id="sheet-base" role="tabpanel">
        <div class="parts" aria-label="H 的六个部分">
          <button class="part" type="button" data-part="E"><strong>E</strong><span>Agent Loop</span></button>
          <button class="part" type="button" data-part="T"><strong>T</strong><span>工具</span></button>
          <button class="part" type="button" data-part="C"><strong>C</strong><span>上下文</span></button>
          <button class="part" type="button" data-part="S"><strong>S</strong><span>状态库</span></button>
          <button class="part" type="button" data-part="L"><strong>L</strong><span>钩子</span></button>
          <button class="part" type="button" data-part="V"><strong>V</strong><span>评测口</span></button>
        </div>
        <ol class="rail">
          <li>
            <button class="line" type="button" data-note="H">
              <span class="idx">Def. 2.1</span>
              <div class="eq" data-tex="H=(E,T,C,S,L,V)\in\mathcal{H}"></div>
              <div class="fb">H = (E, T, C, S, L, V) ∈ ℋ</div>
            </button>
          </li>
          <li>
            <button class="line" type="button" data-note="min">
              <span class="idx">必要 / 充分</span>
              <div class="eq" data-tex="\{E,T\}\subseteq H\ \text{必要},\quad \{E,T,C,S,L,V\}=H\ \text{充分}"></div>
              <div class="fb">{E,T} ⊆ H 必要；六件齐了充分</div>
            </button>
          </li>
          <li>
            <button class="line" type="button" data-note="lts">
              <span class="idx">E 的语义</span>
              <div class="eq" data-tex="E=(Q,\Sigma,\delta),\quad \delta:Q\times\Sigma\to Q"></div>
              <div class="fb">E = (Q, Σ, δ)，δ : Q × Σ → Q</div>
            </button>
          </li>
          <li>
            <button class="line" type="button" data-note="commit">
              <span class="idx">git 载荷</span>
              <div class="eq" data-tex="\mathrm{commit}\ \Leftrightarrow\ H,\qquad S\neq\mathcal{H}"></div>
              <div class="fb">commit ⇔ H，　S ≠ ℋ</div>
            </button>
          </li>
          <li>
            <button class="line" type="button" data-note="model">
              <span class="idx">模型在外</span>
              <div class="eq" data-tex="M\notin H,\qquad \Gamma\text{ 改 }H\text{ 不改 }M"></div>
              <div class="fb">M ∉ H，Γ 改 H 不改 M</div>
            </button>
          </li>
        </ol>
      </div>

      <div class="sheet" id="sheet-gamma" role="tabpanel">
        <ol class="rail">
          <li>
            <button class="line" type="button" data-note="R">
              <span class="idx">验证 1 · R 不是函数于 H 单独</span>
              <div class="eq" data-tex="R:\mathcal{H}\times\mathcal{M}\times\mathsf{Env}\rightharpoonup\mathcal{T}"></div>
              <div class="fb">R : ℋ × ℳ × Env ⇀ 𝒯</div>
            </button>
          </li>
          <li>
            <button class="line" type="button" data-note="Om">
              <span class="idx">验证 2 · Ω 只吃 V 的像</span>
              <div class="eq" data-tex="\tau=V_H(\pi),\quad o=\Omega(\tau),\quad \Omega:\mathrm{im}(V)\to\mathcal{O}"></div>
              <div class="fb">τ = V_H(π)，o = Ω(τ)</div>
            </button>
          </li>
          <li>
            <button class="line" type="button" data-note="Phi">
              <span class="idx">验证 3 · Φ 保 WF，不跑任务</span>
              <div class="eq" data-tex="H^{+}=\Phi(H,o),\quad \mathrm{WF}(H)\Rightarrow\mathrm{WF}(H^{+})"></div>
              <div class="fb">H⁺ = Φ(H, o)，WF(H) ⇒ WF(H⁺)</div>
            </button>
          </li>
          <li>
            <button class="line" type="button" data-note="Gamma">
              <span class="idx">验证 4 · 合法复合</span>
              <div class="eq" data-tex="\Gamma\triangleq\Phi\circ\langle\mathrm{id}_{\mathcal{H}},\Omega\circ R\rangle,\quad \Gamma(H)=\Phi(H,\Omega(R(H)))"></div>
              <div class="fb">Γ ≜ Φ ∘ ⟨id, Ω∘R⟩</div>
            </button>
          </li>
          <li>
            <button class="line" type="button" data-note="notJ">
              <span class="idx">验证 5 · Γ 不算分</span>
              <div class="eq" data-tex="\Gamma:\mathcal{H}\to\mathcal{H},\qquad \Gamma\ \text{不定}\ \mathrm{Acc}"></div>
              <div class="fb">Γ : ℋ → ℋ，Γ 不定 Acc</div>
            </button>
          </li>
        </ol>
      </div>

      <div class="sheet" id="sheet-judge" role="tabpanel">
        <ol class="rail">
          <li>
            <button class="line" type="button" data-note="split">
              <span class="idx">封口</span>
              <div class="eq" data-tex="o=(o_{\mathrm{s}},o_{\mathrm{h}})\in\mathcal{O}_{\mathrm{s}}\times\mathcal{O}_{\mathrm{h}}"></div>
              <div class="fb">o = (o_s, o_h)</div>
            </button>
          </li>
          <li>
            <button class="line" type="button" data-note="nu">
              <span class="idx">搜索信号</span>
              <div class="eq" data-tex="\nu:\mathcal{O}_{\mathrm{s}}\to\mathbb{R},\qquad \mathrm{Imp}(H,H^{+})\iff\nu(o_{\mathrm{s}}^{+})\ge\nu(o_{\mathrm{s}})"></div>
              <div class="fb">ν : 𝒪_s → ℝ，Imp ⇔ ν(o_s⁺) ≥ ν(o_s)</div>
            </button>
          </li>
          <li>
            <button class="line" type="button" data-note="pres">
              <span class="idx">保真</span>
              <div class="eq" data-tex="\mathrm{Sol}(H)\subseteq\mathsf{Tasks},\quad \mathrm{Pres}(H,H^{+})\iff\mathrm{Sol}(H)\subseteq\mathrm{Sol}(H^{+})"></div>
              <div class="fb">Pres ⇔ Sol(H) ⊆ Sol(H⁺)</div>
            </button>
          </li>
          <li>
            <button class="line" type="button" data-note="acc">
              <span class="idx">接受</span>
              <div class="eq" data-tex="\mathrm{Acc}(H,H^{+})\iff\mathrm{WF}(H^{+})\land\mathrm{Pres}(H,H^{+})\land\mathrm{Imp}(H,H^{+})"></div>
              <div class="fb">Acc ⇔ WF ∧ Pres ∧ Imp</div>
            </button>
          </li>
          <li>
            <button class="line" type="button" data-note="exam">
              <span class="idx">期末 ≠ 门控</span>
              <div class="eq" data-tex="\mathrm{Exam}(H)=\nu_{\mathrm{h}}(o_{\mathrm{h}}),\qquad \mathrm{Exam}\notin\mathrm{Acc},\ \ \mathsf{Fwd}\Rightarrow\mathrm{Acc}"></div>
              <div class="fb">Exam ∉ Acc；Fwd ⇒ Acc</div>
            </button>
          </li>
        </ol>
      </div>

      <div class="sheet" id="sheet-git" role="tabpanel">
        <ol class="rail">
          <li>
            <button class="line" type="button" data-note="fwd">
              <span class="idx">fwd · 正向</span>
              <div class="eq" data-tex="\mathsf{Fwd}(A,B)\Rightarrow H(B)=\Gamma(H(A))\land\mathrm{Acc}(H(A),H(B))"></div>
              <div class="fb">Fwd ⇒ Γ 且 Acc</div>
            </button>
          </li>
          <li>
            <button class="line" type="button" data-note="rev">
              <span class="idx">rev · revert</span>
              <div class="eq" data-tex="H(\mathrm{rev}(A,A^{-}))=H_{A^{-}},\quad \pi=\!\{A\},\quad \Gamma\ \text{不出现}"></div>
              <div class="fb">H(rev(A,A⁻)) = H_{A⁻}，π={A}，Γ 不出现</div>
            </button>
          </li>
          <li>
            <button class="line" type="button" data-note="err">
              <span class="idx">err · error commit</span>
              <div class="eq" data-tex="\mathrm{err}(A,o_\bot)=A_\bot,\ \ \mathrm{ok}(A_\bot)=\bot,\ \ H_{A_\bot}\in\{H_A\}\cup\mathrm{im}\,\Phi"></div>
              <div class="fb">err(A, o⊥)=A⊥，ok=⊥</div>
            </button>
          </li>
          <li>
            <button class="line" type="button" data-note="br">
              <span class="idx">br · branch</span>
              <div class="eq" data-tex="\mathrm{br}(\ell,A):\ \mathrm{refs}(\ell)=A,\quad \mathcal{R}\ \text{的 DAG 不变}"></div>
              <div class="fb">br(ℓ, A)：refs(ℓ)=A，DAG 不变</div>
            </button>
          </li>
          <li>
            <button class="line" type="button" data-note="merge">
              <span class="idx">merge</span>
              <div class="eq" data-tex="H_M=\mu(H_{B_i})=\Phi(H_{\ast},\textstyle\bigoplus_i\Omega(R(H_{B_i}))),\ \pi(M)=\{B_i\}"></div>
              <div class="fb">H_M = μ(H_{Bᵢ}) = Φ(H_*, ⊕ Ω(R(H_{Bᵢ})))</div>
            </button>
          </li>
        </ol>
      </div>
      <p class="hint">v2 · Base / Γ 验证 / 评判 J / git　·　v1 在 state-model-v1.html</p>
    </section>

    <aside class="stage">
      <article class="float up" id="detail" aria-live="polite">
        <p class="tag" id="d-tag"></p>
        <h2 id="d-title"></h2>
        <div class="mini" id="d-eq"></div>
        <div id="d-body"></div>
      </article>
    </aside>
  </div>

  <script>
    var PARTS = {
      E: {
        tag: "H · E",
        title: "Agent Loop，不是 evo",
        tex: "E:\\ \\text{observe–think–act}",
        fb: "E: observe–think–act",
        html: "<p><em>管什么：</em>看环境 → 想 → 动手的循环，停与纠错。Survey 写成 LTS。</p><p><em>不管什么：</em>工具清单（T），也不改 harness（Φ）。</p>"
      },
      T: {
        tag: "H · T",
        title: "工具注册表",
        tex: "T:\\ \\text{tool registry}",
        fb: "T: tool registry",
        html: "<p><em>管什么：</em>效应器、路由、schema。</p><p><em>不管什么：</em>循环怎么转（E），窗口里塞什么（C）。</p>"
      },
      C: {
        tag: "H · C",
        title: "上下文管理",
        tex: "C:\\ \\text{context manager}",
        fb: "C: context manager",
        html: "<p><em>管什么：</em>这一拍进模型窗口的内容。</p><p><em>不管什么：</em>跨会话持久化（S）。C 管窗口，S 管抽屉。</p>"
      },
      S: {
        tag: "H · S",
        title: "harness 内的状态库",
        tex: "S:\\ \\text{state store}",
        fb: "S: state store",
        html: "<p><em>管什么：</em>跨 turn 持久化、崩溃恢复。</p><p><em>不管什么：</em>git 里整份 H。S 只是 H 里面的抽屉。</p>"
      },
      L: {
        tag: "H · L",
        title: "生命周期钩子",
        tex: "L:\\ \\text{lifecycle hooks}",
        fb: "L: lifecycle hooks",
        html: "<p><em>管什么：</em>调用前后拦截：鉴权、日志、策略。</p><p><em>不管什么：</em>对外轨迹口（V）。L 是拦截，V 是出口。</p>"
      },
      V: {
        tag: "H · V",
        title: "评测接口",
        tex: "V:\\ \\text{evaluation interface}",
        fb: "V: evaluation interface",
        html: "<p><em>管什么：</em>轨迹与成功信号的出口。</p><p><em>不管什么：</em>合入 git。Ω 读 V 吐出的流。</p>"
      }
    };

    var NOTES = {
      H: {
        tag: "Base · Def. 2.1",
        title: "H 是六个运行时零件",
        tex: "H=(E,T,C,S,L,V)",
        fb: "H = (E, T, C, S, L, V)",
        html: "<p>Survey：agent harness 是封装模型的运行时治理层。悬停上面六个字母看分项。</p><p>Γ 的定义域是 ℋ；git 的每个 commit 载荷一份 H。</p>"
      },
      min: {
        tag: "Base · 边界",
        title: "什么才叫一份 harness",
        tex: "\\{E,T\\}\\subseteq H",
        fb: "{E,T} ⊆ H",
        html: "<p>必要：至少有 Agent Loop 和工具，否则只是单轮 wrapper。</p><p>充分：六件都到生产级才是 full-stack。缺 V 仍然是 harness，只是外层 Ω 吃不到规范轨迹。</p>"
      },
      lts: {
        tag: "Base · LTS",
        title: "E 是带标签的转移系统",
        tex: "E=(Q,\\Sigma,\\delta)",
        fb: "E = (Q, Σ, δ)",
        html: "<p>Q 含 idle / observing / invoking-model / dispatching-tool / … / terminated。</p><p>第一层的 R 就是把这条 LTS 跑出一条路径 τ。E 不是 Φ。</p>"
      },
      commit: {
        tag: "Base · git",
        title: "commit 载荷是整份 H",
        tex: "\\mathrm{commit}\\Leftrightarrow H",
        fb: "commit ⇔ H",
        html: "<p>S 是 H 里面的状态库，不是仓库里的「状态」。ℋ 是 harness 空间，不是 git 的 commit 集合 ℛ。</p>"
      },
      model: {
        tag: "Base · 模型",
        title: "可靠性由 H 决定",
        tex: "M\\notin H",
        fb: "M ∉ H",
        html: "<p>模型冻结、在 H 之外。转换算子改六个零件，不改权重。这是 Survey 的主主张，也是 evo agent system 的前提。</p>"
      },
      R: {
        tag: "Γ · R",
        title: "跑的是 (H,M,Env)，可失败",
        tex: "R:\\mathcal{H}\\times\\mathcal{M}\\times\\mathsf{Env}\\rightharpoonup\\mathcal{T}",
        fb: "R : ℋ × ℳ × Env ⇀ 𝒯",
        html: "<p>验证：R 不是 ℋ→𝒯 的全函数。模型与环境是参数；超时、判题失败则无 τ。</p><p>R 不写 git、不产出 H⁺。失败走进 err，不走进 Γ 的值。</p>"
      },
      Om: {
        tag: "Γ · Ω",
        title: "V 吐流，Ω 只消费",
        tex: "o=\\Omega(V_H(\\pi))",
        fb: "o = Ω(V_H(π))",
        html: "<p>验证：若 R 已跑完整 H，τ 必须是 V 的像。Ω 不是第二套 instrumentation。</p><p>V 缺省时 Ω 偏。搜索分与持有分在评判层拆开，这里只保证 o 存在。</p>"
      },
      Phi: {
        tag: "Γ · Φ",
        title: "提案生成器，不是裁判",
        tex: "\\mathrm{WF}(H)\\Rightarrow\\mathrm{WF}(\\Phi(H,o))",
        fb: "WF(H) ⇒ WF(Φ(H,o))",
        html: "<p>Φ 吃 (H,o) 写出 H⁺。验证：不跑用户任务；不读 o_h；不移动 ref。</p><p>WF 是耦合不变量（至少 E–S）。Φ 成功仍可能 Acc=⊥（回归），那是 J 的事。</p>"
      },
      Gamma: {
        tag: "Γ · 复合",
        title: "pairing，不是 Φ∘Ω∘R",
        tex: "\\Gamma\\triangleq\\Phi\\circ\\langle\\mathrm{id},\\Omega\\circ R\\rangle",
        fb: "Γ ≜ Φ ∘ ⟨id, Ω∘R⟩",
        html: "<p>验证：⟨id,Ω∘R⟩ : ℋ→ℋ×𝒪 才能接到 Φ。Φ∘Ω∘R 类型错误。</p><p>点态 Γ(H)=Φ(H,Ω(R(H))) 在 R,Ω,Φ 有定义时成立。Γ 仍不定 Acc。</p>"
      },
      notJ: {
        tag: "Γ · 边界",
        title: "转换 ≠ 接受",
        tex: "\\Gamma\\nvdash\\mathrm{Acc}",
        fb: "Γ ⊬ Acc",
        html: "<p>Γ 只给出下一份 harness 内容。是否算一次成功进化，由评判层 Acc 决定。</p><p>没有 Acc 的 fwd 只是把提案钉上 DAG，不是「变好了」。</p>"
      },
      split: {
        tag: "J · 封口",
        title: "搜索信号和期末考试拆开",
        tex: "o=(o_{\\mathrm{s}},o_{\\mathrm{h}})",
        fb: "o = (o_s, o_h)",
        html: "<p>o_s 给 Φ 和门控看。o_h 封存，进化过程禁止读。</p><p>混成一个分数，就是 HarnessX 那种 in-domain 虚高。</p>"
      },
      nu: {
        tag: "J · Imp",
        title: "变好只许用搜索观测",
        tex: "\\mathrm{Imp}\\iff\\nu(o_{\\mathrm{s}}^{+})\\ge\\nu(o_{\\mathrm{s}})",
        fb: "Imp ⇔ ν(o_s⁺) ≥ ν(o_s)",
        html: "<p>ν 把 o_s 打成实数（pass@k、avg@k…）。验证：ν 不看 o_h，也不看 git 拓扑。</p><p>仅 Imp、不看 Pres，就是 AHE 对回归盲目。</p>"
      },
      pres: {
        tag: "J · Pres",
        title: "已解决的任务不许丢",
        tex: "\\mathrm{Pres}\\iff\\mathrm{Sol}(H)\\subseteq\\mathrm{Sol}(H^{+})",
        fb: "Pres ⇔ Sol(H) ⊆ Sol(H⁺)",
        html: "<p>Sol 来自 V 的成功信号，是已解决问题集合。preserve-and-extend。</p><p>验证：Pres 与 Imp 独立。只涨均值但丢掉旧题，Acc 为假。</p>"
      },
      acc: {
        tag: "J · Acc",
        title: "一次成功进化的充要",
        tex: "\\mathrm{Acc}\\iff\\mathrm{WF}\\land\\mathrm{Pres}\\land\\mathrm{Imp}",
        fb: "Acc ⇔ WF ∧ Pres ∧ Imp",
        html: "<p>这是进化的评判标准。Γ 产出 H⁺ 之后必须过 Acc，才配称为成功一代。</p><p>WF 挡非法 harness；Pres 挡回归；Imp 要求搜索信号非降。</p>"
      },
      exam: {
        tag: "J · Exam",
        title: "期末考试不进门控",
        tex: "\\mathrm{Exam}\\notin\\mathrm{Acc},\\ \\ \\mathsf{Fwd}\\Rightarrow\\mathrm{Acc}",
        fb: "Exam ∉ Acc；Fwd ⇒ Acc",
        html: "<p>Exam=ν_h(o_h) 只报告泛化，禁止用来选 H⁺。验证：Acc 的公式里没有 o_h。</p><p>第二层：成功 fwd 蕴含 Acc；Acc 为假则 err 或停在提案、不移成功线。</p>"
      },
      fwd: {
        tag: "验证 · fwd",
        title: "成功正向必须已经 Acc",
        tex: "\\mathsf{Fwd}(A,B)\\Rightarrow H(B)=\\Gamma(H(A))\\land\\mathrm{Acc}(H(A),H(B))",
        fb: "Fwd ⇒ Γ 且 Acc",
        html: "<p>内容来自 Γ，parent 为 A，并且过评判。缺 Acc 的钉 DAG 不算成功进化。</p><p>HEAD 移动是 ref 更新。B 由构造子产生，不是 iff 唯一解。</p>"
      },
      rev: {
        tag: "验证 · rev",
        title: "revert 不调用 Γ",
        tex: "H(\\mathrm{rev}(A,A^{-}))=H_{A^{-}}",
        fb: "H(rev(A,A⁻)) = H_{A⁻}",
        html: "<p>内容拷贝祖先，parent 仍是当前 A（append-only）。</p><p>验证：若误写成 H' = Γ(H_A) 就变成 fwd。rev 与 Γ 正交。</p>"
      },
      err: {
        tag: "验证 · err",
        title: "失败也是历史上的点",
        tex: "\\mathrm{ok}(A_\\bot)=\\bot",
        fb: "ok(A⊥) = ⊥",
        html: "<p>R 或 Φ 失败仍 commit。H 可以停在 H_A，或留下半成品。</p><p>验证：o⊥ 进入下一轮 Ω 的记忆；假装没发生会破坏可观测闭环。</p>"
      },
      br: {
        tag: "验证 · br",
        title: "branch 只动 ref",
        tex: "\\mathrm{refs}(\\ell)=A",
        fb: "refs(ℓ) = A",
        html: "<p>验证：br 不改任何 H，不跑 R。之后两条 ref 上可以各自 fwd / rev / err。</p>"
      },
      merge: {
        tag: "验证 · merge",
        title: "多路观测再进 Φ",
        tex: "H_M=\\Phi(H_{\\ast},\\bigoplus_i o_i)",
        fb: "H_M = Φ(H_*, ⊕ oᵢ)",
        html: "<p>μ 不是新的第一层算子，是 Φ 的多元用法：H_* 取一侧基线，oᵢ=Ω(R(H_{Bᵢ}))。</p><p>验证：π(M)={Bᵢ}ₖ，k≥2；若 k=1 则退化为 fwd。Γ 仍是一元的。</p>"
      }
    };

    var detail = document.getElementById("detail");
    var katexReady = false;
    var currentKey = "Gamma";
    var currentPart = null;

    function renderTex(el, tex, display) {
      if (window.katex) {
        window.katex.render(tex, el, { throwOnError: false, displayMode: !!display });
      }
    }

    function rise() {
      detail.classList.remove("up");
      void detail.offsetWidth;
      detail.classList.add("up");
    }

    function paint(n, animate) {
      document.getElementById("d-tag").textContent = n.tag;
      document.getElementById("d-title").textContent = n.title;
      document.getElementById("d-body").innerHTML = n.html;
      var slot = document.getElementById("d-eq");
      if (katexReady && window.katex) renderTex(slot, n.tex, true);
      else slot.textContent = n.fb;
      if (animate !== false) rise();
    }

    function clearOn() {
      document.querySelectorAll(".line").forEach(function (el) { el.classList.remove("is-on"); });
      document.querySelectorAll(".part").forEach(function (el) { el.classList.remove("is-on"); });
    }

    function showNote(key, animate) {
      currentKey = key;
      currentPart = null;
      clearOn();
      document.querySelectorAll('.line[data-note="' + key + '"]').forEach(function (el) {
        el.classList.add("is-on");
      });
      paint(NOTES[key], animate);
    }

    function showPart(key, animate) {
      currentPart = key;
      currentKey = "H";
      clearOn();
      document.querySelectorAll('.part[data-part="' + key + '"]').forEach(function (el) {
        el.classList.add("is-on");
      });
      paint(PARTS[key], animate);
    }

    function openSheet(id, animate) {
      document.querySelectorAll(".tab").forEach(function (el) {
        el.classList.toggle("is-on", el.getAttribute("data-sheet") === id);
      });
      document.querySelectorAll(".sheet").forEach(function (el) {
        el.classList.toggle("is-on", el.id === "sheet-" + id);
      });
      if (id === "base") showNote("H", animate);
      else if (id === "gamma") showNote("Gamma", animate);
      else if (id === "judge") showNote("acc", animate);
      else showNote("fwd", animate);
    }

    function typesetLeft() {
      document.querySelectorAll(".eq").forEach(function (el) {
        if (!window.katex) return;
        window.katex.render(el.getAttribute("data-tex"), el, {
          throwOnError: false,
          displayMode: true
        });
        el.classList.add("visible");
      });
      document.querySelectorAll(".fb").forEach(function (el) { el.classList.remove("visible"); });
    }

    function fallbackLeft() {
      document.querySelectorAll(".eq").forEach(function (el) { el.classList.remove("visible"); });
      document.querySelectorAll(".fb").forEach(function (el) { el.classList.add("visible"); });
    }

    document.querySelectorAll(".tab").forEach(function (el) {
      el.addEventListener("click", function () { openSheet(el.getAttribute("data-sheet")); });
    });
    document.querySelectorAll(".line").forEach(function (el) {
      var key = el.getAttribute("data-note");
      el.addEventListener("mouseenter", function () { showNote(key); });
      el.addEventListener("focus", function () { showNote(key); });
      el.addEventListener("click", function () { showNote(key); });
    });
    document.querySelectorAll(".part").forEach(function (el) {
      var key = el.getAttribute("data-part");
      el.addEventListener("mouseenter", function () { showPart(key); });
      el.addEventListener("focus", function () { showPart(key); });
      el.addEventListener("click", function () { showPart(key); });
    });

    openSheet("base", false);

    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js";
    s.onload = function () {
      katexReady = true;
      typesetLeft();
      if (currentPart) showPart(currentPart, false);
      else showNote(currentKey, false);
    };
    s.onerror = fallbackLeft;
    document.head.appendChild(s);
    setTimeout(function () {
      if (!window.katex) fallbackLeft();
    }, 2500);
  </script>
</body>
</html>
