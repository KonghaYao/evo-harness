<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fenix Eval · 后台</title>
  <link rel="stylesheet" href="/admin/app.css" />
</head>
<body>
  <div class="brand-bar" aria-hidden="true"></div>
  <div class="shell">
    <header class="head">
      <div class="brand">Fenix <span class="word-eval">Eval</span> · 后台</div>
      <nav class="nav" aria-label="后台">
        <a href="#/" data-nav="jobs">作业</a>
        <a href="#/health" data-nav="health">健康</a>
        <a href="/">返回前台</a>
      </nav>
      <form id="token-form" class="token-form" autocomplete="off">
        <label for="token-input">后台令牌</label>
        <input id="token-input" name="token" type="password" spellcheck="false" placeholder="EVAL_DISPLAY_ADMIN_TOKEN" />
        <button type="submit">保存</button>
      </form>
    </header>
    <p id="flash" class="flash" hidden></p>
    <main id="main"></main>
    <p class="foot">Fenix Eval 后台。前台公开可读。写接口仅接受 EVAL_DISPLAY_ADMIN_TOKEN。本页不显示 JWT 或 AWS 密钥。删除作业不可恢复。</p>
  </div>
  <script src="/admin/app.js" defer></script>
</body>
</html>
