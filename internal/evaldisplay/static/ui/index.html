<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fenix Eval</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="brand-bar" aria-hidden="true"></div>
  <div class="wrap">
    <header class="top">
      <div class="brand">Fenix <span class="word-eval">Eval</span></div>
      <nav class="nav" aria-label="视图">
        <a href="#/" data-nav="board">榜单</a>
        <a href="#/compare" data-nav="compare">对照</a>
      </nav>
    </header>

    <p id="flash" class="flash" hidden></p>
    <main id="main"></main>

    <section class="upload" id="upload" aria-labelledby="upload-title">
      <div class="upload-head">
        <h2 id="upload-title">上传作业</h2>
        <button type="button" class="btn" id="upload-copy">复制</button>
      </div>
      <pre><code id="upload-code"></code></pre>
    </section>
  </div>
  <script src="/chart.umd.min.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
