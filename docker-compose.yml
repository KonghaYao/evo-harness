# 默认：RustFS 作业树（S3 兼容 API）+ 命名卷持久化 SQLite。
# 前台 GET /v1 公开，不设置 viewer 令牌。
# 生产请覆盖 ADMIN / ANON / JWT 以及对象存储访问密钥，勿沿用下方开发默认值。
# 无 Docker 的 go run 仍可用 EVAL_DISPLAY_S3_DIR 文件系统后端。
#
# 文档：https://docs.rustfs.com/en/installation/container/docker
# S3 API :9000，Console :9001；默认仅 path-style（未设 RUSTFS_SERVER_DOMAINS）。

name: evo-harness

services:
  eval-display:
    build: .
    image: eval-display:local
    ports:
      - "8080:8080"
    environment:
      EVAL_DISPLAY_ADDR: ":8080"
      EVAL_DISPLAY_SQLITE_PATH: /data/eval-display.sqlite
      EVAL_DISPLAY_ADMIN_TOKEN: ${EVAL_DISPLAY_ADMIN_TOKEN:-dev-admin-token}
      EVAL_DISPLAY_ANON_KEY: ${EVAL_DISPLAY_ANON_KEY:-dev-anon}
      EVAL_DISPLAY_JWT_SECRET: ${EVAL_DISPLAY_JWT_SECRET:-dev-jwt-secret}
      EVAL_DISPLAY_TOKEN: ${EVAL_DISPLAY_TOKEN:-dev-token}
      EVAL_DISPLAY_S3_BACKEND: ${EVAL_DISPLAY_S3_BACKEND:-aws}
      EVAL_DISPLAY_S3_ENDPOINT: ${EVAL_DISPLAY_S3_ENDPOINT:-http://rustfs:9000}
      EVAL_DISPLAY_S3_BUCKET: ${EVAL_DISPLAY_S3_BUCKET:-results}
      EVAL_DISPLAY_S3_REGION: ${EVAL_DISPLAY_S3_REGION:-us-east-1}
      EVAL_DISPLAY_S3_ACCESS_KEY: ${EVAL_DISPLAY_S3_ACCESS_KEY:-rustfs-dev}
      EVAL_DISPLAY_S3_SECRET_KEY: ${EVAL_DISPLAY_S3_SECRET_KEY:-rustfs-dev-secret}
      EVAL_DISPLAY_S3_PATH_STYLE: ${EVAL_DISPLAY_S3_PATH_STYLE:-true}
    volumes:
      - eval-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: us-east-1
      RUSTFS_ACCESS_KEY: ${EVAL_DISPLAY_S3_ACCESS_KEY:-rustfs-dev}
      RUSTFS_SECRET_KEY: ${EVAL_DISPLAY_S3_SECRET_KEY:-rustfs-dev-secret}
      # 官方 docker 示例常设 RUSTFS_OBS_LOG_DIRECTORY=/var/log/rustfs/，但容器用户无法 mkdir 该路径；未设则日志走 stdout。
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      # 官方就绪探针：https://docs.rustfs.com/en/operations/status-check
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  rustfs-init:
    image: rustfs/rc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${EVAL_DISPLAY_S3_ACCESS_KEY:-rustfs-dev}
      RUSTFS_SECRET_KEY: ${EVAL_DISPLAY_S3_SECRET_KEY:-rustfs-dev-secret}
    restart: on-failure
    entrypoint:
      - /bin/sh
      - -c
      - |
        /usr/bin/rc alias set rustfs http://rustfs:9000 "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}" \
          --region us-east-1 --bucket-lookup path &&
        /usr/bin/rc bucket create rustfs/results --ignore-existing

volumes:
  eval-data:
  rustfs-data:
